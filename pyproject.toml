[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "popf-early-prediction-dp"
version = "1.0.0"
description = "Temporal dual-task framework for early postoperative pancreatic leakage and CR-POPF risk after distal pancreatectomy"
requires-python = ">=3.11,<3.12"
license = {text = "MIT"}

[tool.pytest.ini_options]
pythonpath = ["."]
